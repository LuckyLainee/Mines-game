<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ZETYX · Stars Edition</title>
    <style>
        /* --- СБРОС + БАЗА --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        :root {
            --bg-main: #f9f9fb;
            --glass-bg: rgba(255, 255, 255, 0.45);
            --glass-active: rgba(255, 255, 255, 0.75);
            --border-glow: rgba(0, 0, 0, 0.06);
            --text-main: #000000;
            --text-muted: #86868b;
            --accent-color: #000000;
            --nav-height: 75px;
        }

        body {
            background-color: var(--bg-main);
            background-image: 
                radial-gradient(circle at 80% 10%, rgba(0, 0, 0, 0.02) 0%, transparent 50%),
                radial-gradient(circle at 10% 90%, rgba(0, 0, 0, 0.03) 0%, transparent 50%);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: -webkit-fill-available;
            padding: 20px 16px calc(var(--nav-height) + env(safe-area-inset-bottom, 16px)) 16px;
            overflow: hidden;
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--border-glow);
            border-radius: 24px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.02);
        }

        .header {
            margin-bottom: 16px;
            flex-shrink: 0;
        }
        .header h1 {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 6px;
            text-transform: uppercase;
            text-align: center;
            background: linear-gradient(180deg, #000000 0%, #555555 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .app-section {
            display: none;
            flex-direction: column;
            flex-grow: 1;
            overflow-y: auto;
            padding-right: 2px;
        }
        .app-section.active {
            display: flex;
        }
        .app-section::-webkit-scrollbar { width: 4px; }
        .app-section::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.08); border-radius: 10px; }

        /* === АРЕНА === */
        .wallet-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            margin-bottom: 16px;
            flex-shrink: 0;
        }
        .balance-info {
            display: flex;
            flex-direction: column;
        }
        .balance-label {
            font-size: 9px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 700;
        }
        .balance-val {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }
        .wallet-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .wallet-btn {
            background: rgba(0,0,0,0.03);
            border: 1px solid var(--border-glow);
            color: var(--text-main);
            padding: 10px 16px;
            border-radius: 14px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .wallet-btn:active { transform: scale(0.97); }
        .wallet-btn.deposit {
            background: #000000;
            color: #ffffff;
            border: none;
            font-weight: 800;
        }

        /* рулетка */
        .roulette-viewport {
            position: relative;
            width: 100%;
            height: 232px;
            overflow: hidden;
            margin-bottom: 16px;
            flex-shrink: 0;
        }
        .center-marker {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 100%;
            background: #ffaa00;
            box-shadow: 0 0 12px rgba(255,170,0,0.5);
            z-index: 10;
        }
        .tape-track {
            display: flex;
            align-items: center;
            position: absolute;
            left: 0;
            top: 26px;
            height: 180px;
            width: max-content;
            transition: transform 6s cubic-bezier(0.1, 0.8, 0.1, 1);
        }
        .avatar-card {
            width: 180px;
            height: 180px;
            background: rgba(255,255,255,0.8);
            border: 2px solid rgba(0,0,0,0.08);
            border-radius: 36px;
            margin-right: 24px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
        }
        .avatar-card img {
            width: 88px;
            height: 88px;
            border-radius: 20px;
            object-fit: cover;
            border: 1px solid rgba(0,0,0,0.05);
            margin-bottom: 12px;
        }
        .avatar-card span {
            font-size: 16px;
            font-weight: 800;
            color: #000;
            text-align: center;
        }
        .avatar-card .prize-price {
            font-size: 14px;
            color: var(--text-muted);
            margin-top: 4px;
            font-weight: 700;
        }

        /* список призов (горизонтальный скролл) */
        .prizes-scroll {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding: 12px 4px 16px 4px;
            margin-top: 6px;
            flex-shrink: 0;
            scrollbar-width: thin;
        }
        .prizes-scroll::-webkit-scrollbar { height: 4px; }
        .prizes-scroll::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 10px; }
        .prize-item-mini {
            background: rgba(255,255,255,0.6);
            border: 1px solid var(--border-glow);
            border-radius: 16px;
            padding: 10px 16px;
            min-width: 110px;
            text-align: center;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .prize-item-mini img {
            width: 44px;
            height: 44px;
            margin-bottom: 6px;
            object-fit: contain;
        }
        .prize-item-mini span {
            font-size: 12px;
            font-weight: 800;
        }

        /* кнопки */
        .bet-controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex-shrink: 0;
            margin-top: 6px;
        }
        .btn-bet {
            width: 100%;
            background: #000000;
            color: #ffffff;
            border: none;
            border-radius: 18px;
            padding: 18px;
            font-size: 16px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }
        .btn-bet:active { transform: scale(0.95); }
        .btn-bet:disabled { background: #888; cursor: not-allowed; transform: none; }
        .btn-demo {
            background: rgba(0,0,0,0.05);
            color: #000000;
            box-shadow: none;
            border: 1px solid var(--border-glow);
        }

        /* === ИСТОРИЯ === */
        .section-title {
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 700;
            margin-bottom: 16px;
            padding-left: 4px;
        }
        .history-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .history-item {
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* === АККАУНТ === */
        .profile-header {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 20px;
            margin-bottom: 16px;
        }
        .profile-avatar-large {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: rgba(255,255,255,0.8);
            border: 1px solid var(--border-glow);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .profile-avatar-large img { width: 100%; height: 100%; object-fit: cover; }
        .profile-info h2 {
            font-size: 18px;
            font-weight: 800;
            margin-bottom: 4px;
        }
        .profile-id {
            font-size: 11px;
            color: var(--text-muted);
            font-family: monospace;
        }
        .profile-balance-card {
            background: #000000;
            color: #ffffff;
            border-radius: 24px;
            padding: 24px;
            margin-bottom: 20px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.08);
        }
        .p-balance-label {
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: rgba(255,255,255,0.6);
            font-weight: 700;
        }
        .p-balance-val {
            font-size: 28px;
            font-weight: 900;
            margin-bottom: 18px;
            letter-spacing: -0.5px;
        }
        .p-balance-actions {
            display: flex;
            gap: 10px;
        }
        .p-balance-actions button {
            flex: 1;
            padding: 12px;
            border-radius: 14px;
            border: none;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .p-btn-deposit { background: #ffffff; color: #000000; }
        .p-btn-withdraw { background: rgba(255,255,255,0.15); color: #ffffff; border: 1px solid rgba(255,255,255,0.1); }

        /* статистика */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 6px;
        }
        .stat-card {
            background: rgba(255,255,255,0.5);
            border: 1px solid var(--border-glow);
            border-radius: 16px;
            padding: 14px 10px;
            text-align: center;
        }
        .stat-card .num {
            font-size: 20px;
            font-weight: 900;
            letter-spacing: -0.5px;
        }
        .stat-card .label {
            font-size: 8px;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            font-weight: 700;
            margin-top: 4px;
        }

        /* === ИНВЕНТАРЬ === */
        .inventory-placeholder {
            padding: 32px 0;
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
        }

        /* === НАВИГАЦИЯ === */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100vw;
            height: calc(var(--nav-height) + env(safe-area-inset-bottom, 0px));
            background: rgba(255,255,255,0.7);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-top: 1px solid var(--border-glow);
            display: flex;
            justify-content: space-around;
            align-items: flex-start;
            padding-top: 10px;
            padding-bottom: env(safe-area-inset-bottom, 0px);
            z-index: 90;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: none;
            border: none;
            cursor: pointer;
            width: 20%;
            color: var(--text-muted);
            transition: color 0.2s, transform 0.1s ease;
            gap: 4px;
        }
        .nav-item:active { transform: scale(0.95); }
        .nav-item.active { color: #000000; }
        .nav-item svg {
            width: 22px;
            height: 22px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.3;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .nav-label {
            font-size: 8px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }

        /* МОДАЛ */
        .overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(255,255,255,0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 100;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }
        .overlay.show { opacity: 1; visibility: visible; }
        .modal {
            background: rgba(255,255,255,0.85);
            border: 1px solid rgba(0,0,0,0.05);
            border-radius: 28px;
            padding: 24px;
            width: 100%;
            max-width: 340px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.06);
            transform: scale(0.95);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .overlay.show .modal { transform: scale(1); }
        .modal-title {
            font-size: 14px;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 12px;
            letter-spacing: 1.5px;
        }
        .modal-body {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 24px;
        }
        .modal-close-btn {
            background: #000000;
            border: none;
            color: #ffffff;
            padding: 14px;
            border-radius: 16px;
            font-weight: 800;
            font-size: 12px;
            text-transform: uppercase;
            cursor: pointer;
            width: 100%;
            letter-spacing: 1px;
        }
        .modal-input {
            width: 100%;
            background: rgba(0,0,0,0.03);
            border: 1px solid var(--border-glow);
            border-radius: 14px;
            padding: 14px;
            color: #000000;
            font-size: 14px;
            margin: 8px 0;
            outline: none;
            text-align: center;
        }

        /* Лоадер */
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- МОДАЛ -->
    <div class="overlay" id="modal-overlay" onclick="closeModal(event)">
        <div class="modal" id="modal-content" onclick="event.stopPropagation()">
            <div class="modal-title" id="modal-title">Внимание</div>
            <div class="modal-body" id="modal-body">Сообщение</div>
            <button class="modal-close-btn" id="modal-action-btn" onclick="closeModalBtn()">Принять</button>
        </div>
    </div>

    <!-- ШАПКА -->
    <div class="header"><h1>ZETYX</h1></div>

    <!-- ====== АРЕНА ====== -->
    <div id="section-arena" class="app-section active">
        <div class="wallet-bar glass-panel">
            <div class="balance-info">
                <span class="balance-label">Баланс</span>
                <span class="balance-val"><span class="user-balance-val">0</span> ⭐</span>
            </div>
            <div class="wallet-actions">
                <button class="wallet-btn deposit" onclick="openDepositModal()">Пополнить</button>
            </div>
        </div>

        <div class="roulette-viewport glass-panel" id="roulette-container">
            <div class="center-marker"></div>
            <div class="tape-track" id="tape-track"></div>
        </div>

        <div class="bet-controls">
            <button class="btn-bet" id="spin-btn" onclick="spinRoulette(false)">Крутить</button>
            <button class="btn-bet btn-demo" id="demo-spin-btn" onclick="spinRoulette(true)">Демо-версия</button>
        </div>

        <!-- Призы: горизонтальный скролл -->
        <div style="margin-top: 12px;">
            <div style="font-size:9px; color:var(--text-muted); text-transform:uppercase; letter-spacing:1.5px; font-weight:700; margin-bottom:4px;">Возможные призы</div>
            <div class="prizes-scroll" id="prizes-scroll"></div>
        </div>
    </div>

    <!-- ====== ИСТОРИЯ ====== -->
    <div id="section-history" class="app-section">
        <h3 class="section-title">История кручений</h3>
        <div class="history-list" id="history-list">
            <div style="text-align:center; color:var(--text-muted); font-size:12px; padding:12px 0;">Пока пусто</div>
        </div>
    </div>

    <!-- ====== ИНВЕНТАРЬ ====== -->
    <div id="section-inventory" class="app-section">
        <h3 class="section-title">Инвентарь</h3>
        <div class="glass-panel" style="padding:20px;">
            <div class="inventory-placeholder">Здесь будут ваши призы, но пока ничего нет.</div>
        </div>
    </div>

    <!-- ====== АККАУНТ ====== -->
    <div id="section-account" class="app-section">
        <div class="profile-header glass-panel">
            <div class="profile-avatar-large" id="profile-avatar-box"></div>
            <div class="profile-info">
                <h2 id="profile-username">Загрузка...</h2>
                <div class="profile-id">ID: <span id="profile-user-id">00000000</span></div>
            </div>
        </div>

        <div class="profile-balance-card">
            <div class="p-balance-label">Игровой баланс</div>
            <div class="p-balance-val"><span class="user-balance-val">0</span> ⭐</div>
            <div class="p-balance-actions">
                <button class="p-btn-deposit" onclick="openDepositModal()">Пополнить</button>
                <button class="p-btn-withdraw" onclick="openWithdrawModal()">Вывод</button>
            </div>
        </div>

        <!-- Статистика (локальный кеш) -->
        <div style="margin-top: 4px;">
            <div style="font-size:9px; color:var(--text-muted); text-transform:uppercase; letter-spacing:1.5px; font-weight:700; margin-bottom:10px;">Статистика игрока</div>
            <div class="stats-grid">
                <div class="stat-card glass-panel"><div class="num" id="stat-total-spins">0</div><div class="label">Всего круток</div></div>
                <div class="stat-card glass-panel"><div class="num" id="stat-demo-spins">0</div><div class="label">Демо-круток</div></div>
                <div class="stat-card glass-panel"><div class="num" id="stat-max-win">0</div><div class="label">Макс. выигрыш</div></div>
                <div class="stat-card glass-panel"><div class="num" id="stat-total-won">0</div><div class="label">Всего выиграно</div></div>
            </div>
        </div>
    </div>

    <!-- НАВИГАЦИЯ (4 вкладки) -->
    <div class="bottom-nav">
        <button class="nav-item active" onclick="switchTab('arena')">
            <svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="3" /><path d="M6 12h4M8 10v4M15 11h.01M18 13h.01" /></svg>
            <div class="nav-label">Арена</div>
        </button>
        <button class="nav-item" onclick="switchTab('history')">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" /><path d="M12 6v6l4 2" /></svg>
            <div class="nav-label">История</div>
        </button>
        <button class="nav-item" onclick="switchTab('inventory')">
            <svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2" /><path d="M8 5v14M16 5v14" /></svg>
            <div class="nav-label">Инвентарь</div>
        </button>
        <button class="nav-item" onclick="switchTab('account')">
            <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" /><circle cx="12" cy="7" r="4" /></svg>
            <div class="nav-label">Аккаунт</div>
        </button>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        // ============================================================
        // 1. Telegram WebApp
        // ============================================================
        const tg = window.Telegram?.WebApp;
        if (tg) { 
            tg.ready(); 
            tg.expand(); 
            tg.enableClosingConfirmation(); 
            tg.setHeaderColor('#f9f9fb'); 
        }

        // ============================================================
        // 2. Настройки для XTR инвойсов
        // ============================================================
        const BOT_TOKEN = '8267359178:AAH7u_7zBLRWVvHfgQuxuJceIOPbh0u4ivM';

        // ============================================================
        // 3. ЮЗЕР
        // ============================================================
        const user = {
            id: tg?.initDataUnsafe?.user?.id || '12345678',
            username: tg?.initDataUnsafe?.user?.username ? `@${tg.initDataUnsafe.user.username}` : '@Lainee',
            photo: tg?.initDataUnsafe?.user?.photo_url || 'https://api.dicebear.com/7.x/bottts/svg?seed=GAMER'
        };

        let userBalance = 0;

        // ============================================================
        // 4. СТАТИСТИКА (локальный кеш)
        // ============================================================
        let stats = {
            totalSpins: 0,
            demoSpins: 0,
            maxWin: 0,
            totalWon: 0
        };

        function loadStats() {
            try {
                const raw = localStorage.getItem('zetyx_stats');
                if (raw) {
                    const parsed = JSON.parse(raw);
                    stats.totalSpins = parsed.totalSpins || 0;
                    stats.demoSpins = parsed.demoSpins || 0;
                    stats.maxWin = parsed.maxWin || 0;
                    stats.totalWon = parsed.totalWon || 0;
                }
            } catch(e) {}
            updateStatsUI();
        }
        function saveStats() {
            try {
                localStorage.setItem('zetyx_stats', JSON.stringify(stats));
            } catch(e) {}
        }
        function updateStatsUI() {
            document.getElementById('stat-total-spins').textContent = stats.totalSpins;
            document.getElementById('stat-demo-spins').textContent = stats.demoSpins;
            document.getElementById('stat-max-win').textContent = stats.maxWin;
            document.getElementById('stat-total-won').textContent = stats.totalWon;
        }

        // ============================================================
        // 5. ПРИЗЫ (15 штук)
        // ============================================================
        const PRIZES = [
            { id: 15, img: '15.png', value: 15 },
            { id: 25, img: '25.png', value: 25 },
            { id: 50, img: '50.png', value: 50 },
            { id: 100, img: '100.png', value: 100 },
            { id: 385, img: '385.png', value: 385 },
            { id: 399, img: '399.png', value: 399 },
            { id: 525, img: '525.png', value: 525 },
            { id: 650, img: '650.png', value: 650 },
            { id: 560, img: '560.png', value: 560 },
            { id: 449, img: '449.png', value: 449 },
            { id: 555, img: '555.png', value: 555 },
            { id: 488, img: '488.png', value: 488 },
            { id: 398, img: '398.png', value: 398 },
            { id: 498, img: '498.png', value: 498 },
            { id: 499, img: '499.png', value: 499 }
        ];

        // ============================================================
        // 6. ИНИТ
        // ============================================================
        document.getElementById('profile-username').textContent = user.username;
        document.getElementById('profile-user-id').textContent = user.id;
        document.getElementById('profile-avatar-box').innerHTML = `<img src="${user.photo}" alt="avatar">`;
        updateBalance(0);
        renderPrizesScroll();
        prefillRoulette();
        loadStats();

        function updateBalance(newBal) {
            userBalance = newBal;
            document.querySelectorAll('.user-balance-val').forEach(el => el.textContent = userBalance);
        }

        function renderPrizesScroll() {
            const container = document.getElementById('prizes-scroll');
            container.innerHTML = '';
            PRIZES.forEach(p => {
                const div = document.createElement('div');
                div.className = 'prize-item-mini';
                div.innerHTML = `
                    <img src="${p.img}" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0MCIgaGVpZ2h0PSI0MCI+PHJlY3Qgd2lkdGg9IjQwIiBoZWlnaHQ9IjQwIiBmaWxsPSIjZWVlIi8+PHRleHQgeD0iNTAlIiB5PSI1MCUiIGFsaWdubWVudC1iYXNlbGluZT0ibWlkZGxlIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmb250LWZhbWlseT0ic2Fucy1zZXJpZiIgZm9udC1zaXplPSIxMCIgZmlsbD0iIzU1NSI+W1BpY108L3RleHQ+PC9zdmc+'">
                    <span>${p.value} ⭐</span>
                `;
                container.appendChild(div);
            });
        }

        // ============================================================
        // 7. РУЛЕТКА
        // ============================================================
        function prefillRoulette() {
            const track = document.getElementById('tape-track');
            track.innerHTML = '';
            for(let i=0; i<15; i++) {
                const rp = PRIZES[Math.floor(Math.random() * PRIZES.length)];
                track.appendChild(createPrizeCard(rp));
            }
        }
        function createPrizeCard(prizeObj) {
            const card = document.createElement('div');
            card.className = 'avatar-card';
            card.innerHTML = `
                <img src="${prizeObj.img}" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoIjg4IiBoZWlnaHQiODgiPjxyZWN0IHdpZHRoPSI4OCIgaGVpZ2h0PSI4OCIgZmlsbD0iI2VlZSIvPjx0ZXh0IHg9IjUwJSIgeT0iNTAlIiBhbGlnbm1lbnQtYmFzZWxpbmU9Im1pZGRsZSIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZm9udC1mYW1pbHk9InNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMTQiIGZpbGw9IiM1NTUiPltJbWFnZV08L3RleHQ+PC9zdmc+'">
                <span>ПРИЗ</span>
                <div class="prize-price">${prizeObj.value} ⭐</div>
            `;
            return card;
        }

        function spinRoulette(isDemo = false) {
            const spinBtn = document.getElementById('spin-btn');
            const demoBtn = document.getElementById('demo-spin-btn');

            if (!isDemo) {
                if (userBalance < 21) {
                    showModal('Недостаточно ⭐', 'Пополните баланс. Стоимость крутки — 21 ⭐.', 'Пополнить', openDepositModal);
                    return;
                }
                updateBalance(userBalance - 21);
            }

            spinBtn.disabled = true;
            demoBtn.disabled = true;
            spinBtn.textContent = isDemo ? 'ДЕМО...' : 'КРУТИМ...';

            const track = document.getElementById('tape-track');
            track.style.transition = 'none';
            track.style.transform = 'translateX(0px)';
            track.innerHTML = '';

            const tapeArray = [];
            for(let i=0; i<50; i++) tapeArray.push(PRIZES[Math.floor(Math.random() * PRIZES.length)]);
            const winnerIndex = 40;
            const winningPrize = tapeArray[winnerIndex];

            tapeArray.forEach(p => track.appendChild(createPrizeCard(p)));

            setTimeout(() => {
                const cardWidth = 204;
                const viewportWidth = document.getElementById('roulette-container').offsetWidth;
                const targetOffset = (winnerIndex * cardWidth) - (viewportWidth/2) + (cardWidth/2);
                const shift = Math.floor(Math.random() * 80) - 40;
                track.style.transition = 'transform 6s cubic-bezier(0.1, 0.8, 0.1, 1)';
                track.style.transform = `translateX(-${targetOffset + shift}px)`;
            }, 50);

            setTimeout(() => {
                if (isDemo) {
                    stats.demoSpins += 1;
                    showModal('Демо-режим', `Ваш приз в инвентаре: <b>${winningPrize.value} ⭐</b> (не зачислено, демо-режим).`);
                } else {
                    stats.totalSpins += 1;
                    const won = winningPrize.value;
                    updateBalance(userBalance + won);
                    stats.totalWon += won;
                    if (won > stats.maxWin) stats.maxWin = won;
                    showModal('Поздравляем!', `Ваш приз в инвентаре: <b>${won} ⭐</b> (зачислено на баланс).`);
                    addHistoryItem(winningPrize);
                }
                saveStats();
                updateStatsUI();

                spinBtn.disabled = false;
                demoBtn.disabled = false;
                spinBtn.textContent = 'Крутить';
            }, 6500);
        }

        function addHistoryItem(prize) {
            const list = document.getElementById('history-list');
            if(list.innerText.includes('Пока пусто')) list.innerHTML = '';
            const item = document.createElement('div');
            item.className = 'history-item glass-panel';
            item.innerHTML = `
                <div style="display:flex; align-items:center; gap:12px;">
                    <img src="${prize.img}" style="width:40px; height:40px; border-radius:8px; object-fit:cover;" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0MCIgaGVpZ2h0PSI0MCI+PHJlY3Qgd2lkdGg9IjQwIiBoZWlnaHQ9IjQwIiBmaWxsPSIjZWVlIi8+PC9zdmc+">
                    <div>
                        <div style="font-size:13px; font-weight:700;">Выигрыш</div>
                        <div style="font-size:10px; color:var(--text-muted);">только что</div>
                    </div>
                </div>
                <div style="font-size:14px; font-weight:800;">${prize.value} ⭐</div>
            `;
            list.prepend(item);
        }

        // ============================================================
        // 8. ДЕПОЗИТ → ИНВОЙС XTR (С ОБРАБОТКОЙ ОШИБОК)
        // ============================================================
        async function createXTRInvoice(amount) {
            const url = `https://api.telegram.org/bot${BOT_TOKEN}/createInvoiceLink`;
            const payload = {
                title: `Пополнение баланса ZETYX`,
                description: `Начисление ${amount} ⭐ на игровой счёт`,
                payload: `deposit_${amount}_${Date.now()}`,
                currency: "XTR",
                prices: [{ label: `${amount} ⭐`, amount: amount }]
            };

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await response.json();
                if (data.ok && data.result) {
                    return data.result;
                } else {
                    console.error('Ошибка от Telegram:', data.description);
                    return null;
                }
            } catch (e) {
                console.error('Ошибка запроса:', e);
                return null;
            }
        }

        function openDepositModal() {
            showModal(
                'Пополнение баланса',
                `<div style="text-align:left;">
                    <p style="margin-bottom:6px; color:#000; font-weight:bold;">Введите сумму (⭐):</p>
                    <input type="number" class="modal-input" id="deposit-amount" placeholder="Например 100" min="1">
                </div>`,
                'Пополнить',
                async () => {
                    const amt = parseInt(document.getElementById('deposit-amount')?.value);
                    if (!amt || amt < 1) {
                        showModal('Ошибка', 'Введите корректную сумму (минимум 1 ⭐).');
                        return;
                    }

                    const btn = document.getElementById('modal-action-btn');
                    const originalText = btn.textContent;
                    btn.innerHTML = '<span class="spinner"></span> Создаём инвойс...';
                    btn.disabled = true;

                    try {
                        const invoiceLink = await createXTRInvoice(amt);
                        btn.innerHTML = originalText;
                        btn.disabled = false;

                        if (!invoiceLink) {
                            showModal('Ошибка', 'Не удалось создать инвойс. Проверьте подключение к интернету и попробуйте позже.');
                            return;
                        }

                        // Проверяем, есть ли tg и метод openInvoice
                        if (tg && tg.openInvoice) {
                            // Открываем инвойс через Telegram
                            tg.openInvoice(invoiceLink, (status) => {
                                console.log('Статус оплаты:', status);
                                if (status === 'paid') {
                                    updateBalance(userBalance + amt);
                                    showModal('Успешно!', `Баланс пополнен на ${amt} ⭐`);
                                } else if (status === 'failed') {
                                    showModal('Ошибка', 'Платеж не выполнен. Попробуйте еще раз.');
                                } else if (status === 'pending') {
                                    showModal('В обработке', 'Платеж обрабатывается. Баланс обновится после подтверждения.');
                                } else {
                                    showModal('Информация', `Статус: ${status}`);
                                }
                            });
                        } else {
                            // Если не в Telegram — открываем ссылку
                            window.open(invoiceLink, '_blank');
                            showModal('Информация', 
                                'Инвойс открыт в новой вкладке. После оплаты нажмите "Проверить оплату".',
                                'Проверить оплату',
                                () => {
                                    // Имитация проверки
                                    updateBalance(userBalance + amt);
                                    showModal('Успешно!', `Баланс пополнен на ${amt} ⭐`);
                                }
                            );
                        }
                    } catch (e) {
                        btn.innerHTML = originalText;
                        btn.disabled = false;
                        showModal('Ошибка', 'Произошла ошибка при создании инвойса: ' + e.message);
                        console.error(e);
                    }
                }
            );
        }

        // ============================================================
        // 9. ВЫВОД
        // ============================================================
        function openWithdrawModal() {
            showModal(
                'Вывод средств',
                `<div style="text-align:left;">
                    <p style="margin-bottom:6px; color:#000; font-weight:bold;">Сумма для вывода (минимум 100 ⭐):</p>
                    <input type="number" class="modal-input" id="withdraw-amount" placeholder="100" min="100">
                </div>`,
                'Вывести',
                () => {
                    const amt = parseInt(document.getElementById('withdraw-amount')?.value);
                    if (!amt || amt < 100) {
                        showModal('Ошибка', 'Минимальная сумма вывода — 100 ⭐.');
                    } else if (amt > userBalance) {
                        showModal('Ошибка', 'Недостаточно средств на балансе.');
                    } else {
                        updateBalance(userBalance - amt);
                        showModal('Заявка принята', `Заявка на вывод ${amt} ⭐ обрабатывается (1–3 дня).`);
                    }
                }
            );
        }

        // ============================================================
        // 10. ПЕРЕКЛЮЧЕНИЕ ВКЛАДОК
        // ============================================================
        function switchTab(tabId) {
            document.querySelectorAll('.app-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
            document.getElementById(`section-${tabId}`).classList.add('active');
            const map = { arena:'Арена', history:'История', inventory:'Инвентарь', account:'Аккаунт' };
            const label = map[tabId] || tabId;
            document.querySelectorAll('.nav-item').forEach(b => {
                if (b.textContent.trim().toLowerCase() === label.toLowerCase()) b.classList.add('active');
            });
        }

        // ============================================================
        // 11. МОДАЛКИ
        // ============================================================
        const overlay = document.getElementById('modal-overlay');
        const modalTitle = document.getElementById('modal-title');
        const modalBody = document.getElementById('modal-body');
        const modalActionBtn = document.getElementById('modal-action-btn');

        function showModal(title, contentHtml, btnText = "Принять", callback = null) {
            modalTitle.textContent = title;
            modalBody.innerHTML = contentHtml;
            modalActionBtn.textContent = btnText;
            modalActionBtn.disabled = false;
            overlay.classList.add('show');
            // Убираем старые обработчики
            modalActionBtn.onclick = null;
            modalActionBtn.onclick = () => {
                closeModalBtn();
                if (callback) callback();
            };
        }
        function closeModal(e) { 
            if (e && e.target !== overlay) return; 
            overlay.classList.remove('show'); 
        }
        function closeModalBtn() { 
            overlay.classList.remove('show'); 
        }

        overlay.addEventListener('click', function(e) {
            if (e.target === overlay) overlay.classList.remove('show');
        });
    </script>
</body>
